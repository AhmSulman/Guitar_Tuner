name: Build Guitar Tuner APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # Every push/PR builds BOTH the debug APK and an unsigned release AAB, and
    # verifies 16 KB page alignment on each. The AAB is what goes to Play, so
    # it has to be built and checked here, not only on tag pushes.
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-python downloads its toolchain from GitHub Releases, which can
      # 504 for hours. If it fails, fall back to the runner's own Python 3.10
      # (Ubuntu 22.04 ships 3.10.12) in a venv, so pip/buildozer resolve the same.
      - name: Set up Python 3.10
        id: setup_py
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fall back to the runner's system Python 3.10
        if: steps.setup_py.outcome == 'failure'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-venv python3-pip
          python3 -m venv "$HOME/venv"
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          # Buildozer adds `pip install --user` unless VIRTUAL_ENV is set, and
          # --user installs fail inside a venv.
          echo "VIRTUAL_ENV=$HOME/venv" >> "$GITHUB_ENV"
          "$HOME/venv/bin/python" --version

      - name: Cache buildozer downloads
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-v5
          restore-keys: buildozer-

      # p4a's downloaded source tarballs (OpenSSL, SDL2, CPython, ...) and the
      # bundletool jar. Most of these come from GitHub Releases, which can
      # return 504 for hours (2026-11-08: every release download failed, and
      # openssl.org just redirects there). Cached, a build only needs the
      # network for what changed. Restored by prefix, so a new spec still
      # starts from the last good set.
      - name: Cache p4a source downloads and bundletool
        uses: actions/cache@v4
        with:
          path: |
            .buildozer/android/platform/build-arm64-v8a/packages
            ~/.cache/bundletool
          key: p4a-packages-${{ hashFiles('buildozer.spec') }}-v1
          restore-keys: p4a-packages-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            libffi-dev libssl-dev pkg-config \
            autoconf libtool cmake build-essential \
            libncurses5 zlib1g-dev

      - name: Install buildozer and Cython
        run: pip install --upgrade pip buildozer cython

      - name: Pre-accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.android/licenses"
          printf '%s\n' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            > "$HOME/.android/licenses/android-sdk-license"
          printf '%s\n' \
            '84831b9409646a918e30573bab4c9c91346d8abd' \
            > "$HOME/.android/licenses/android-sdk-preview-license"

      # GitHub Releases can 504 for hours; seed p4a's download cache from
      # SHA-256-pinned mirrors so OpenSSL/SDL2 never depend on it alone.
      - name: Pre-fetch p4a sources (GitHub Releases fallback)
        run: bash .github/scripts/prefetch-p4a-sources.sh

      - name: Build APK
        run: yes | buildozer -v android debug

      - name: Verify 16 KB page alignment (APK)
        run: bash .github/scripts/check-16kb.sh bin/*.apk

      # No P4A_RELEASE_* env here, so p4a produces an unsigned bundle. Recipes are
      # already compiled by the debug build above; this only re-runs packaging.
      - name: Build unsigned release AAB
        run: yes | buildozer -v android release

      - name: Verify 16 KB page alignment (AAB)
        run: bash .github/scripts/check-16kb.sh "$(ls bin/*.aab | head -1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTuner-APK
          path: bin/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload unsigned AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTuner-AAB-unsigned
          path: bin/*.aab
          retention-days: 14
          if-no-files-found: error

  release:
    # Signed .aab for Google Play — only on version tags or manual dispatch.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # Fail in seconds, not after a 40-minute build, when a secret is missing.
      - name: Check signing secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Signing secret $name is not set. Add it under Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit $missing

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-python downloads its toolchain from GitHub Releases, which can
      # 504 for hours. If it fails, fall back to the runner's own Python 3.10
      # (Ubuntu 22.04 ships 3.10.12) in a venv, so pip/buildozer resolve the same.
      - name: Set up Python 3.10
        id: setup_py
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fall back to the runner's system Python 3.10
        if: steps.setup_py.outcome == 'failure'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-venv python3-pip
          python3 -m venv "$HOME/venv"
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          # Buildozer adds `pip install --user` unless VIRTUAL_ENV is set, and
          # --user installs fail inside a venv.
          echo "VIRTUAL_ENV=$HOME/venv" >> "$GITHUB_ENV"
          "$HOME/venv/bin/python" --version

      - name: Cache buildozer downloads
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-release-${{ hashFiles('buildozer.spec') }}-v1
          restore-keys: buildozer-release-

      # p4a's downloaded source tarballs (OpenSSL, SDL2, CPython, ...) and the
      # bundletool jar. Most of these come from GitHub Releases, which can
      # return 504 for hours (2026-11-08: every release download failed, and
      # openssl.org just redirects there). Cached, a build only needs the
      # network for what changed. Restored by prefix, so a new spec still
      # starts from the last good set.
      - name: Cache p4a source downloads and bundletool
        uses: actions/cache@v4
        with:
          path: |
            .buildozer/android/platform/build-arm64-v8a/packages
            ~/.cache/bundletool
          key: p4a-packages-${{ hashFiles('buildozer.spec') }}-v1
          restore-keys: p4a-packages-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            libffi-dev libssl-dev pkg-config \
            autoconf libtool cmake build-essential \
            libncurses5 zlib1g-dev

      - name: Install buildozer and Cython
        run: pip install --upgrade pip buildozer cython

      - name: Pre-accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.android/licenses"
          printf '%s\n' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            > "$HOME/.android/licenses/android-sdk-license"
          printf '%s\n' \
            '84831b9409646a918e30573bab4c9c91346d8abd' \
            > "$HOME/.android/licenses/android-sdk-preview-license"

      # Secret goes through env, never interpolated into the script text.
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/release.keystore"

      # GitHub Releases can 504 for hours; seed p4a's download cache from
      # SHA-256-pinned mirrors so OpenSSL/SDL2 never depend on it alone.
      - name: Pre-fetch p4a sources (GitHub Releases fallback)
        run: bash .github/scripts/prefetch-p4a-sources.sh

      - name: Build signed release AAB
        env:
          P4A_RELEASE_KEYSTORE: /home/runner/release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: yes | buildozer -v android release

      - name: Clean up keystore
        if: always()
        run: rm -f "$HOME/release.keystore"

      - name: Verify 16 KB page alignment (signed AAB)
        run: bash .github/scripts/check-16kb.sh "$(ls bin/*.aab | head -1)"

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTuner-AAB-signed
          path: bin/*.aab
          retention-days: 14
          if-no-files-found: error
