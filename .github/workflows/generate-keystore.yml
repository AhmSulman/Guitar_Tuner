name: Generate Release Keystore (one-time)

# Run this once, manually, from the Actions tab ("Run workflow").
# It creates a new signing keystore using the JDK already installed on the
# runner (no local Java needed) and hands you back the 4 GitHub secret
# values to paste into Settings > Secrets and variables > Actions.
#
# IMPORTANT: back up the downloaded keystore/password somewhere safe.
# Losing it means you can never publish an update under the same signing
# identity again (unless Play App Signing is enabled, which allows a
# one-time upload-key reset via Play Console).

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias'
        required: true
        default: 'guitartuner'
      cn:
        description: 'Certificate CN (your name or org — not shown to users)'
        required: true
        default: 'Ahmed Salman'

jobs:
  generate:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore and credentials (password never logged)
        run: |
          set -e
          ALIAS="${{ inputs.key_alias }}"
          STOREPASS=$(openssl rand -base64 24)
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STOREPASS" \
            -keypass "$STOREPASS" \
            -dname "CN=${{ inputs.cn }}, OU=Dev, O=Dev, L=Unknown, S=Unknown, C=US" \
            > /dev/null 2>&1
          {
            echo "ANDROID_KEYSTORE_BASE64=$(base64 -w0 release.keystore)"
            echo "ANDROID_KEYSTORE_PASSWORD=$STOREPASS"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
            echo "ANDROID_KEY_PASSWORD=$STOREPASS"
          } > secrets.env
          rm -f release.keystore

      - name: Upload credentials (download and delete immediately)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-secrets
          path: secrets.env
          retention-days: 1
